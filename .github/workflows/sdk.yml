name: SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "test-vectors/**"
      - "deployments/**"
      - "contracts/kepter/src/errors.rs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "sdk/**"
      - "test-vectors/**"
      - "deployments/**"
      - "contracts/kepter/src/errors.rs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sdk.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sdk

jobs:
  sdk:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
