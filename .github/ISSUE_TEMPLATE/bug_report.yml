name: Bug report
description: Something in the contract, SDK or website does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this could let someone take or lock money, **stop** and follow [SECURITY.md](https://github.com/bluebridgehq/kepter/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Contract
        - SDK
        - Website
        - Scripts or CI
        - Docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Steps, a failing test, or a testnet transaction link.
      placeholder: |
        1. Open https://kepter.vercel.app/s/...
        2. Connect Freighter on Test Net
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, browser or wallet
      description: For example the commit hash, "Chrome 141 on Android with Freighter", or the Stellar CLI version.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images in, or paste console output.
