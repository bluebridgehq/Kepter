<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .num { font-size: 15px; font-weight: 800; fill: #0F4C3A; letter-spacing: 1.5px; }
      .title { font-size: 25px; font-weight: 800; fill: #14211D; }
      .text { font-size: 16px; fill: #4B5853; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#F2A33A"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#FBF7F1"/>

  <!-- Step 1: pick a shop -->
  <g transform="translate(40 40)">
    <rect width="245" height="225" rx="20" fill="#FFFFFF" stroke="#E7DFD3" stroke-width="1.5"/>
    <rect x="22" y="22" width="56" height="56" rx="16" fill="#E2F1EA"/>
    <g transform="translate(34 34)" fill="none" stroke="#0F4C3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 11l2.5-8h23l2.5 8"/><path d="M2 11h28v3a4 4 0 0 1-7 2.6A4 4 0 0 1 16 17a4 4 0 0 1-7-.4A4 4 0 0 1 2 14z"/><path d="M5 18v12h22V18"/><path d="M13 30v-7h6v7"/>
    </g>
    <text x="22" y="114" class="num">STEP 1</text>
    <text x="22" y="146" class="title">Pick a shop</text>
    <text x="22" y="178" class="text">Find one near them by</text>
    <text x="22" y="200" class="text">city and category.</text>
  </g>

  <line x1="293" y1="152" x2="325" y2="152" stroke="#F2A33A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: buy a card -->
  <g transform="translate(333 40)">
    <rect width="245" height="225" rx="20" fill="#FFFFFF" stroke="#E7DFD3" stroke-width="1.5"/>
    <rect x="22" y="22" width="56" height="56" rx="16" fill="#E2F1EA"/>
    <g transform="translate(32 37)">
      <rect width="36" height="24" rx="4" fill="#0F4C3A"/>
      <rect x="25" width="5" height="24" fill="#F2A33A"/>
      <rect x="5" y="15" width="11" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
    <text x="22" y="114" class="num">STEP 2</text>
    <text x="22" y="146" class="title">Buy a card</text>
    <text x="22" y="178" class="text">Pay in USDC. The money</text>
    <text x="22" y="200" class="text">is held by the contract.</text>
  </g>

  <line x1="586" y1="152" x2="618" y2="152" stroke="#F2A33A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: send the link -->
  <g transform="translate(626 40)">
    <rect width="245" height="225" rx="20" fill="#FFFFFF" stroke="#E7DFD3" stroke-width="1.5"/>
    <rect x="22" y="22" width="56" height="56" rx="16" fill="#E2F1EA"/>
    <g transform="translate(34 35)" fill="none" stroke="#0F4C3A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h24a2 2 0 0 1 2 2v15a2 2 0 0 1-2 2H13l-7 6v-6H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M9 11h14M9 16h9"/>
    </g>
    <text x="22" y="114" class="num">STEP 3</text>
    <text x="22" y="146" class="title">Send the link</text>
    <text x="22" y="178" class="text">On WhatsApp, text or</text>
    <text x="22" y="200" class="text">email. No app needed.</text>
  </g>

  <line x1="879" y1="152" x2="911" y2="152" stroke="#F2A33A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: use it -->
  <g transform="translate(919 40)">
    <rect width="241" height="225" rx="20" fill="#0F4C3A"/>
    <rect x="22" y="22" width="56" height="56" rx="16" fill="#FFFFFF" fill-opacity="0.12"/>
    <g transform="translate(35 35)" fill="#FFFFFF">
      <path d="M0 0h12v12H0zM3 3v6h6V3zM18 0h12v12H18zM21 3v6h6V3zM0 18h12v12H0zM3 21v6h6v-6z" fill-rule="evenodd"/>
      <rect x="18" y="18" width="4" height="4"/><rect x="26" y="18" width="4" height="4"/><rect x="22" y="22" width="4" height="4"/><rect x="18" y="26" width="4" height="4"/><rect x="26" y="26" width="4" height="4"/>
    </g>
    <text x="22" y="114" class="num" style="fill:#F2A33A">STEP 4</text>
    <text x="22" y="146" class="title" style="fill:#FFFFFF">Use it</text>
    <text x="22" y="178" class="text" style="fill:#FFFFFF;fill-opacity:.82">QR at the counter or a</text>
    <text x="22" y="200" class="text" style="fill:#FFFFFF;fill-opacity:.82">code for an online order.</text>
  </g>

  <!-- Rules -->
  <g transform="translate(40 290)">
    <rect width="1120" height="58" rx="16" fill="#FFFFFF" stroke="#E7DFD3" stroke-width="1.5"/>
    <circle cx="28" cy="29" r="11" fill="#E2F1EA"/>
    <path d="M23 29l3.5 3.5L33 25" fill="none" stroke="#0F4C3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="35" font-size="16" fill="#14211D"><tspan font-weight="700">The shop is paid the moment a card is used.</tspan> If it expires, the rest follows the shop's rule. If the shop closes, everyone who paid gets it back.</text>
  </g>
</svg>
